<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#07181b" />
<title>Ficha de Treino</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  :root {
    --bg1:#07181b; --bg2:#0b2c30;
    --card:rgba(255,255,255,0.05); --card-b:rgba(255,255,255,0.09);
    --green:#34f23a; --green-dk:#04210a; --green-soft:rgba(52,242,58,0.15);
    --yellow:#f2c94c; --red:#ff6b57;
    --text:#f4f7f7; --dim:#8da3a6; --dim2:#5d7377;
    --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  }
  html, body { margin:0; padding:0; min-height:100%; color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
  body { background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg1) 100%) fixed; }
  .cond { font-family:'Barlow Condensed','Arial Narrow',Impact,sans-serif; text-transform:uppercase; letter-spacing:.06em; }
  button { font-family:inherit; color:inherit; cursor:pointer; }
  input, select, textarea { font-family:inherit; }

  #app { max-width:480px; margin:0 auto; padding:calc(var(--safe-t) + 14px) 18px calc(170px + var(--safe-b)); }
  .page-title { font-size:26px; font-weight:800; margin:6px 0 14px; }

  /* ---------- top bar ---------- */
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  .plan-pill { display:flex; gap:9px; align-items:center; padding:11px 18px; border-radius:999px;
    background:rgba(255,255,255,.07); border:1px solid var(--card-b); font-weight:600; font-size:15px; }
  .plan-pill svg { width:20px; height:20px; }
  .top-actions { display:flex; gap:10px; }
  .icon-btn { width:42px; height:42px; border-radius:50%; background:rgba(255,255,255,.07); border:1px solid var(--card-b);
    display:flex; align-items:center; justify-content:center; padding:0; }
  .icon-btn svg { width:19px; height:19px; }

  .day-chips { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; margin-bottom:4px; }
  .day-chips::-webkit-scrollbar { display:none; }
  .day-chip { flex:1; min-width:60px; padding:9px 4px; border-radius:14px; text-align:center; background:rgba(255,255,255,.05);
    border:1px solid var(--card-b); color:var(--dim); }
  .day-chip .d { font-size:10px; letter-spacing:.08em; font-weight:600; }
  .day-chip .c { font-family:'Barlow Condensed',sans-serif; font-size:19px; font-weight:800; color:var(--text); }
  .day-chip.active { background:var(--green-soft); border-color:var(--green); }
  .day-chip.active .d, .day-chip.active .c { color:var(--green); }

  .sec-title { font-size:14px; font-weight:700; margin:24px 0 12px; }
  .sec-head { display:flex; justify-content:space-between; align-items:center; margin:26px 0 4px; }
  .sec-head .sec-title { margin:0; }
  .link-btn { background:none; border:none; font-size:15px; color:var(--text); display:flex; align-items:center; gap:6px; padding:4px 0; }
  .link-btn svg { width:15px; height:15px; }

  .pill-row { display:flex; gap:9px; overflow-x:auto; scrollbar-width:none; }
  .pill-row::-webkit-scrollbar { display:none; }
  .info-pill { flex-shrink:0; padding:12px 18px; border-radius:999px; background:rgba(255,255,255,.07);
    border:1px solid var(--card-b); font-size:14.5px; white-space:nowrap; }

  .muscle-row { display:flex; gap:12px; overflow-x:auto; scrollbar-width:none; }
  .muscle-row::-webkit-scrollbar { display:none; }
  .muscle-card { width:112px; height:116px; border-radius:20px; background:rgba(255,255,255,.05); border:1px solid var(--card-b);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-size:12.5px; color:var(--dim); flex-shrink:0; }
  .muscle-card svg { height:74px; width:auto; }

  /* ---------- exercise rows / thumbs ---------- */
  .ex-thumb { position:relative; width:76px; height:92px; border-radius:16px; background:#fff; flex-shrink:0; }
  .ex-thumb .ph { position:absolute; inset:0; border-radius:16px; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .ex-thumb .ph img { width:100%; height:100%; object-fit:cover; }
  .ex-thumb .ph svg { height:88%; width:auto; }
  .ex-thumb .badge { position:absolute; right:-6px; bottom:-6px; width:34px; height:34px; border-radius:11px; background:#0f3a3d;
    border:2px solid #0a2528; display:flex; align-items:center; justify-content:center; }
  .ex-thumb .badge svg { height:26px; width:auto; }
  .ex-thumb.sm { width:64px; height:78px; border-radius:14px; }
  .ex-thumb.sm .ph { border-radius:14px; }
  .ex-thumb.sm .badge { width:28px; height:28px; border-radius:9px; }
  .ex-thumb.sm .badge svg { height:21px; }

  .ex-row { display:flex; align-items:center; gap:18px; padding:16px 0; border-bottom:1px solid rgba(255,255,255,.08); cursor:pointer; }
  .ex-info { flex:1; min-width:0; }
  .ex-title { font-size:17px; font-weight:600; line-height:1.25; }
  .ex-sub { font-size:13.5px; color:var(--dim); margin-top:7px; display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .ex-sub svg { width:15px; height:15px; }
  .kebab { background:none; border:none; font-size:22px; color:var(--dim); padding:6px 4px; line-height:1; }

  /* ---------- buttons ---------- */
  .cta-green { display:block; width:100%; border:none; border-radius:999px; padding:18px; background:var(--green); color:var(--green-dk);
    font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:18px; letter-spacing:.07em; text-transform:uppercase;
    box-shadow:0 12px 32px rgba(52,242,58,.28); }
  #cta-start { position:fixed; left:50%; transform:translateX(-50%); width:calc(100% - 36px); max-width:444px;
    bottom:calc(84px + var(--safe-b)); z-index:25; }

  /* ---------- library ---------- */
  .search-row { display:flex; gap:10px; align-items:center; margin-bottom:12px; }
  .search-input { flex:1; padding:12px 16px; border-radius:999px; border:1px solid var(--card-b); background:rgba(255,255,255,.07);
    color:var(--text); font-size:15px; outline:none; }
  .filter-pills { display:flex; gap:9px; overflow-x:auto; scrollbar-width:none; margin-bottom:14px; }
  .filter-pills::-webkit-scrollbar { display:none; }
  .fpill { flex-shrink:0; padding:11px 18px; border-radius:999px; border:1px solid var(--card-b); background:rgba(255,255,255,.07);
    font-size:14.5px; white-space:nowrap; color:var(--text); }
  .fpill.active { background:var(--green-soft); border-color:var(--green); color:var(--green); font-weight:600; }
  .count-row { display:flex; justify-content:space-between; font-size:14px; color:var(--dim); margin-bottom:14px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .g-card { border-radius:20px; overflow:hidden; background:#10292c; cursor:pointer; }
  .g-img { position:relative; background:#fff; aspect-ratio:1/0.95; display:flex; align-items:center; justify-content:center; }
  .g-img img { width:100%; height:100%; object-fit:cover; }
  .g-img svg.body { height:86%; width:auto; }
  .g-star { position:absolute; top:10px; right:10px; width:30px; height:30px; border-radius:50%; border:none; background:#8f9a9c;
    display:flex; align-items:center; justify-content:center; padding:0; }
  .g-star svg { width:16px; height:16px; }
  .g-star.on { background:#f2c94c; }
  .g-name { padding:16px 14px 18px; font-size:15.5px; font-weight:500; line-height:1.3; min-height:74px; }
  .empty { text-align:center; color:var(--dim2); font-size:13.5px; padding:46px 10px; }

  /* ---------- overlays ---------- */
  .overlay { position:fixed; inset:0; z-index:60; display:none; flex-direction:column;
    background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 60%,var(--bg1) 100%); }
  .overlay.show { display:flex; }
  #detail { z-index:70; }
  .ov-head { display:flex; align-items:center; justify-content:space-between; padding:calc(var(--safe-t) + 14px) 18px 12px; flex-shrink:0; }
  .ov-head h2 { margin:0; font-size:17px; font-weight:600; text-align:center; flex:1; }
  .ov-body { flex:1; overflow-y:auto; padding:0 0 calc(130px + var(--safe-b)); }
  .ov-inner { max-width:480px; margin:0 auto; padding:0 18px; }

  /* session */
  .stats { display:grid; grid-template-columns:repeat(3,1fr); text-align:center; padding:14px 0 22px; }
  .stat .v { font-size:25px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:7px; }
  .stat .l { font-size:13.5px; color:var(--dim); margin-top:3px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--green); display:inline-block; }
  .s-wrap { background:rgba(0,0,0,.2); }
  .s-card { padding:22px 18px 20px; border-bottom:1px solid rgba(255,255,255,.07); max-width:480px; margin:0 auto; }
  .s-head { display:flex; gap:16px; align-items:flex-start; }
  .s-head .info { flex:1; min-width:0; }
  .chips { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:8px; }
  .chip-y, .chip-g { font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:4px 9px; border-radius:8px; }
  .chip-y { color:var(--yellow); border:1px solid rgba(242,201,76,.5); background:rgba(242,201,76,.1); }
  .chip-g { color:var(--green); border:1px solid rgba(52,242,58,.4); background:rgba(52,242,58,.08); }
  .s-name { font-size:19px; font-weight:600; line-height:1.25; }
  .alarm-btn { background:none; border:none; padding:0; color:var(--dim); display:inline-flex; }
  .alarm-btn svg { width:16px; height:16px; }

  .s-table { margin-top:20px; }
  .t-head, .t-row { display:grid; grid-template-columns:48px 1fr 1fr 48px; align-items:center; gap:6px; }
  .t-head { font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.07em; font-size:13px; color:var(--dim); padding:0 12px 10px; text-align:center; }
  .t-row { background:rgba(255,255,255,.055); border-radius:16px; padding:10px 12px; margin-bottom:9px; transition:background .15s; }
  .t-row.done { background:rgba(52,242,58,.17); }
  .t-row .n { text-align:center; font-size:16px; font-weight:600; color:var(--dim); }
  .t-row.done .n { color:var(--green); }
  .t-row input { width:100%; background:transparent; border:none; outline:none; color:var(--text); text-align:center; font-size:17px; font-weight:500; padding:8px 0; }
  .t-row input::placeholder { color:var(--dim2); }
  .chk { width:36px; height:36px; border-radius:50%; border:none; background:rgba(255,255,255,.1); color:var(--dim);
    font-size:16px; font-weight:800; display:flex; align-items:center; justify-content:center; padding:0; justify-self:center; }
  .t-row.done .chk { background:var(--green); color:var(--green-dk); }
  .tech-line { font-size:11px; color:var(--yellow); text-align:center; margin:-4px 0 10px; }
  .s-actions { display:flex; justify-content:space-between; align-items:center; margin-top:14px; }
  .s-actions button { background:none; border:none; font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.06em;
    font-weight:700; font-size:14.5px; display:flex; align-items:center; gap:10px; padding:6px 0; }
  .s-actions .plus { width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,.1); display:inline-flex; align-items:center; justify-content:center; font-size:20px; font-weight:400; }
  .s-actions .tick { width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,.1); display:inline-flex; align-items:center; justify-content:center; font-size:15px; }
  .finish-bar { position:fixed; left:0; right:0; bottom:0; padding:14px 18px calc(16px + var(--safe-b)); z-index:5;
    background:linear-gradient(180deg,rgba(7,24,27,0) 0%,rgba(7,24,27,.92) 40%); }
  .finish-bar .cta-green { max-width:444px; margin:0 auto; }
  .exec-note { font-size:12.5px; color:var(--dim); margin-top:12px; line-height:1.45; }

  /* detail */
  .d-media { background:#fff; border-radius:22px; overflow:hidden; display:flex; align-items:center; justify-content:center; min-height:240px; margin-bottom:16px; }
  .d-media img { width:100%; max-height:340px; object-fit:contain; display:block; }
  .d-media svg.body { height:230px; width:auto; padding:10px 0; }
  .d-media .video-box { width:100%; aspect-ratio:16/9; background:#000; }
  .d-media .video-box iframe { width:100%; height:100%; border:0; }
  .seg { display:flex; gap:8px; margin-bottom:12px; }
  .seg button { flex:1; padding:11px; border-radius:999px; border:1px solid var(--card-b); background:rgba(255,255,255,.06); font-size:14px; font-weight:600; }
  .seg button.active { background:var(--green-soft); border-color:var(--green); color:var(--green); }
  .d-chips { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
  .d-title { font-size:24px; font-weight:700; margin:4px 0 12px; line-height:1.2; }
  .d-sec { font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.07em; font-size:14px; font-weight:700; margin:22px 0 10px; }
  .d-sets .t-row { grid-template-columns:48px 1fr 1fr; }
  .d-text { font-size:14.5px; color:var(--dim); line-height:1.55; }

  /* progress */
  .tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:18px; }
  .tile { background:rgba(255,255,255,.05); border:1px solid var(--card-b); border-radius:18px; padding:14px 8px; text-align:center; }
  .tile .v { font-size:22px; font-weight:700; }
  .tile .l { font-size:11.5px; color:var(--dim); margin-top:3px; }
  .chart-card { background:rgba(255,255,255,.05); border:1px solid var(--card-b); border-radius:22px; padding:16px; margin-bottom:18px; }
  .chart-card .t { font-size:13px; color:var(--dim); margin-bottom:6px; }
  .chart-card .big { font-size:26px; font-weight:700; color:#b58cff; }
  .hist-row { display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid rgba(255,255,255,.08); }
  .hist-row .a { font-size:15.5px; font-weight:600; }
  .hist-row .b { font-size:12.5px; color:var(--dim); margin-top:4px; }
  .hist-row .c { font-size:15px; font-weight:700; color:#b58cff; text-align:right; }

  /* edit / forms */
  .f-label { font-size:11px; color:var(--dim); letter-spacing:.06em; margin:14px 0 6px; text-transform:uppercase; font-weight:700; }
  .f-input, .f-select, .f-area { width:100%; background:rgba(255,255,255,.07); border:1px solid var(--card-b); color:var(--text);
    font-size:15px; padding:12px 14px; border-radius:14px; outline:none; }
  .f-select option { color:#000; }
  .f-area { resize:vertical; min-height:60px; }
  .e-card { background:rgba(255,255,255,.045); border:1px solid var(--card-b); border-radius:22px; padding:6px 16px 16px; margin-bottom:14px; }
  .set-edit-row { display:flex; gap:8px; flex-wrap:wrap; align-items:flex-start; margin-top:4px; }
  .set-edit { display:flex; flex-direction:column; align-items:center; gap:2px; }
  .set-edit input { width:72px; background:rgba(255,255,255,.07); border:1px solid var(--card-b); color:var(--text); text-align:center; padding:10px 4px; border-radius:12px; font-size:14px; }
  .rm-set { background:none; border:none; color:var(--red); font-size:16px; padding:2px; }
  .add-set-btn { width:42px; height:42px; border-radius:12px; border:1px dashed var(--dim2); background:none; color:var(--dim); font-size:20px; }
  .e-actions { display:flex; gap:8px; margin-top:16px; }
  .e-actions button { flex:1; padding:12px 4px; border-radius:14px; border:1px solid var(--card-b); background:rgba(255,255,255,.06); font-size:13.5px; font-weight:600; }
  .e-actions .danger { color:var(--red); border-color:rgba(255,107,87,.35); }
  .dashed-btn { display:block; width:100%; padding:16px; border-radius:20px; border:1.5px dashed rgba(52,242,58,.45); background:none; color:var(--green); font-weight:700; font-size:15px; }
  .hint { font-size:12px; margin-top:6px; color:var(--dim); line-height:1.4; }
  .hint.ok { color:var(--green); } .hint.bad { color:var(--red); }
  .hint img { max-height:70px; border-radius:8px; display:block; margin-top:6px; }
  .btn-row { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
  .btn-soft { flex:1; min-width:120px; text-align:center; padding:14px 8px; border-radius:16px; border:1px solid var(--card-b); background:rgba(255,255,255,.07); font-size:14px; font-weight:600; }
  .btn-soft.danger { color:var(--red); border-color:rgba(255,107,87,.35); }
  .note { font-size:13px; color:var(--dim); line-height:1.5; background:rgba(255,255,255,.05); border:1px solid var(--card-b); border-radius:18px; padding:14px 16px; margin-top:14px; }

  /* ---------- bottom nav ---------- */
  #bottom-nav { position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex; justify-content:center;
    background:rgba(6,20,23,.94); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border-top:1px solid rgba(255,255,255,.07); padding:8px 8px calc(8px + var(--safe-b)); }
  .nav-inner { display:flex; width:100%; max-width:480px; }
  .nav-btn { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 2px; background:none; border:none; color:var(--dim2); }
  .nav-btn svg { width:22px; height:22px; }
  .nav-btn .l { font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:.06em; font-size:11.5px; font-weight:700; }
  .nav-btn.active { color:var(--text); }
  .nav-btn.active .ic { background:rgba(255,255,255,.12); }
  .ic { width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .nav-btn .ic { margin-bottom:-2px; }

  /* sheets / toast / timer */
  #sheet-ov { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:90; display:none; align-items:flex-end; justify-content:center; }
  #sheet-ov.show { display:flex; }
  #sheet { width:100%; max-width:480px; background:#0d2a2e; border-radius:26px 26px 0 0; padding:10px 18px calc(22px + var(--safe-b)); max-height:80vh; overflow-y:auto; }
  #sheet .grab { width:42px; height:5px; border-radius:3px; background:rgba(255,255,255,.2); margin:4px auto 14px; }
  #sheet h3 { margin:0 0 10px; font-size:16px; }
  .sheet-item { display:flex; align-items:center; gap:14px; width:100%; text-align:left; background:none; border:none; padding:15px 4px;
    border-bottom:1px solid rgba(255,255,255,.07); font-size:16px; }
  .sheet-item.danger { color:var(--red); }
  .pick-item { padding:14px 4px; border-bottom:1px solid rgba(255,255,255,.07); font-size:15.5px; cursor:pointer; }
  #toast { position:fixed; left:50%; bottom:calc(150px + var(--safe-b)); transform:translateX(-50%) translateY(10px); background:#e9f6ea; color:#06210a;
    padding:12px 20px; border-radius:999px; font-size:14px; font-weight:600; opacity:0; pointer-events:none; transition:all .25s; z-index:120; white-space:nowrap; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #timer-bar { position:fixed; left:0; right:0; bottom:calc(150px + var(--safe-b)); display:flex; justify-content:center; z-index:100;
    pointer-events:none; opacity:0; transform:translateY(10px); transition:all .2s; }
  #timer-bar.show { opacity:1; transform:none; pointer-events:auto; }
  .timer-pill { display:flex; align-items:center; gap:12px; background:#0d2a2e; border:1px solid var(--green); border-radius:999px; padding:9px 10px 9px 20px; box-shadow:0 10px 30px rgba(0,0,0,.5); }
  .timer-time { font-family:'Barlow Condensed',sans-serif; font-size:24px; font-weight:800; color:var(--green); min-width:62px; font-variant-numeric:tabular-nums; }
  .timer-pill button { width:36px; height:36px; border-radius:50%; border:none; background:rgba(255,255,255,.1); font-size:15px; }
  .timer-pill button.x { background:none; color:var(--dim); }
</style>
</head>
<body>
<div id="app">
  <section id="page-plano" class="page"></section>
  <section id="page-lib" class="page" hidden></section>
  <section id="page-prog" class="page" hidden></section>
  <section id="page-edit" class="page" hidden></section>
  <section id="page-aj" class="page" hidden></section>
</div>

<button id="cta-start" class="cta-green">Iniciar treino</button>

<div id="session" class="overlay"></div>
<div id="detail" class="overlay"></div>

<div id="sheet-ov"><div id="sheet"></div></div>

  function inferCategory(e) {
    var t = ((e.focus || "") + " " + (e.name || "")).toLowerCase();
    if (t.indexOf("peito") >= 0) return "Peito";
    if (t.indexOf("costas") >= 0 || t.indexOf("dorsal") >= 0) return "Costas";
    if (t.indexOf("deltoide") >= 0 || t.indexOf("ombro") >= 0) return "Ombros";
    if (t.indexOf("bíceps") >= 0 || t.indexOf("braquial") >= 0) return "Bíceps";
    if (t.indexOf("tríceps") >= 0) return "Tríceps";
    if (t.indexOf("quadríceps") >= 0 || t.indexOf("posterior") >= 0 || t.indexOf("glúteo") >= 0 || t.indexOf("panturrilha") >= 0 || t.indexOf("isquio") >= 0) return "Pernas";
    if (t.indexOf("core") >= 0 || t.indexOf("abdom") >= 0) return "Core";
    return "Outros";
  }
  function loadData() {
    var d = jget(DATA_KEY, null);
    if (!d) { d = defaultData(); jset(DATA_KEY, d); return d; }
    var changed = false;
    Object.keys(d).forEach(function(code) {
      d[code].exercises.forEach(function(e) {
        if (e.category === undefined) { e.category = inferCategory(e); changed = true; }
        if (e.img === undefined) { e.img = ""; changed = true; }
        if (e.video === undefined) { e.video = ""; changed = true; }
        if (e.grip === undefined) { e.grip = "—"; changed = true; }
      });
    });
    if (changed) jset(DATA_KEY, d);
    return d;
  }

  }
  function cloneTemplate(name) {
    for (var i = 0; i < ORDER.length; i++) {
      var list = DATA[ORDER[i]].exercises;
      for (var j = 0; j < list.length; j++) if (list[j].name === name) return JSON.parse(JSON.stringify(list[j]));
    }
    return ex(name, "", ["8–12","8–12","8–12"], "60s", "", "", "—", "", "", "Outros");
  }
  function allUniqueExercises() {

    return out;
  }

  function restSeconds(str) {
    var re = /(\d+)\s*(min|s)/gi, m, last = null;
    while ((m = re.exec(str)) !== null) last = m;
    if (!last) return 60;
    var v = parseInt(last[1], 10);
    return last[2].toLowerCase() === "min" ? v * 60 : v;
  }
  function estimateMinutes(d) {
    var sec = 0;
    d.exercises.forEach(function(e) { sec += e.sets.length * (45 + restSeconds(e.interval)); });
    return Math.max(5, Math.round(sec / 60 / 5) * 5);
  }
  function fmtTime(s) {
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return h > 0 ? h + ":" + p(m) + ":" + p(r) : p(m) + ":" + p(r);
  }

  var timerH = null, timerRem = 0, timerPaused = false;
  function beep() {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
      o.start(); o.stop(ctx.currentTime + 0.55);
    } catch (e) {}
    if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
  }
  function startTimer(sec) {
    clearInterval(timerH); timerRem = sec; timerPaused = false;
    $("timer-time").textContent = fmtTime(timerRem); $("timer-toggle").textContent = "⏸";
    $("timer-bar").classList.add("show");
    timerH = setInterval(function() {

  /* ---------------- Sessão de treino ---------------- */
  var sessionTick = null;
  function sessionStats() {
    var d = DATA[current], vol = 0, done = 0;
    d.exercises.forEach(function(e, i) {
      e.sets.forEach(function(r, s) {
        var k = pk(current, i, s);
        if (PROGRESS["done:" + k]) {
          done++;
          var kg = parseFloat(String(PROGRESS["kg:" + k] || "").replace(",", ".")) || 0;
          var reps = parseInt(PROGRESS["reps:" + k], 10) || firstInt(r);
          vol += kg * reps;
        }
      });
    });
    var dur = SESSION ? Math.floor((Date.now() - SESSION.start) / 1000) : 0;
    return { vol: Math.round(vol), done: done, dur: dur, cal: Math.round(dur / 60 * 6) };
  }
  function updateSessionStats() {
    if (!$("st-dur")) return;
    var s = sessionStats();
    $("st-dur").textContent = fmtTime(s.dur); $("st-cal").textContent = s.cal; $("st-vol").textContent = s.vol;
  }
  function openSession() {
    if (!SESSION || SESSION.day !== current || Date.now() - SESSION.start > 8 * 3600 * 1000) {
      SESSION = { day: current, start: Date.now() }; jset(SESSION_KEY, SESSION);
    }
    renderSession();
    $("session").classList.add("show");
    clearInterval(sessionTick); sessionTick = setInterval(updateSessionStats, 1000);
  }
  function closeSession() {
    $("session").classList.remove("show"); clearInterval(sessionTick);
    if (page === "plano") renderPlano();
  }
  function renderSession() {
    var d = DATA[current], s = sessionStats();
    var h = '<div class="ov-head"><button class="icon-btn" id="s-close">' + ICON.close + '</button><h2>' + esc(DAYNAMES[d.day] || d.label) + '</h2>'
      + '<button class="icon-btn" id="s-menu" style="font-size:20px;">⋮</button></div>'
      + '<div class="ov-body"><div class="ov-inner"><div class="stats">'
      + '<div class="stat"><div class="v"><span class="dot"></span><span id="st-dur">' + fmtTime(s.dur) + '</span></div><div class="l">Duração</div></div>'
      + '<div class="stat"><div class="v" id="st-cal">' + s.cal + '</div><div class="l">Calorias (est.)</div></div>'
      + '<div class="stat"><div class="v" id="st-vol">' + s.vol + '</div><div class="l">Volume (kg)</div></div></div>'
      + '<div class="sec-head" style="margin-top:0;"><div class="sec-title cond">' + d.exercises.length + ' exercícios</div>'
      + '<button class="link-btn" id="s-add">Adicionar exercício +</button></div></div>'
      + '<div class="s-wrap">';
    d.exercises.forEach(function(e, i) {
      h += '<div class="s-card"><div class="s-head">' + thumbHtml(e, true) + '<div class="info">'
        + '<div class="chips">' + (e.tech ? '<span class="chip-y">' + esc(e.tech) + '</span>' : '') + (e.grip && e.grip !== "—" ? '<span class="chip-g">Pegada ' + esc(e.grip) + '</span>' : '') + '</div>'
        + '<div class="s-name">' + esc(e.name) + '</div>'
        + '<div class="ex-sub">' + e.sets.length + ' séries • ' + esc(repsLabel(e)) + ' • <button class="alarm-btn" data-rest="' + i + '" aria-label="Descanso">' + ICON.alarm + '</button></div></div>'
        + '<button class="kebab" data-smenu="' + i + '">⋮</button></div>'
        + '<div class="s-table"><div class="t-head"><div>Série</div><div>Reps</div><div>Peso (kg)</div><div></div></div>';
      e.sets.forEach(function(r, sidx) {
        var k = pk(current, i, sidx), done = !!PROGRESS["done:" + k];
        var last = LAST[k] || {};
        h += '<div class="t-row' + (done ? " done" : "") + '"><div class="n">' + (sidx + 1) + '</div>'
          + '<input inputmode="numeric" data-reps="' + k + '" placeholder="' + esc(last.reps || r) + '" value="' + esc(PROGRESS["reps:" + k] || "") + '" />'
          + '<input inputmode="decimal" data-kg="' + k + '" placeholder="' + esc(last.kg || "kg") + '" value="' + esc(PROGRESS["kg:" + k] || "") + '" />'
          + '<button class="chk" data-chk="' + k + '">✓</button></div>';
      });
      h += '</div><div class="s-actions"><button data-add="' + i + '"><span class="plus">+</span> Adicionar série</button>'
        + '<button data-all="' + i + '">Marcar todas as séries <span class="tick">✓</span></button></div>'
        + (e.exec ? '<div class="exec-note">' + esc(e.exec) + '</div>' : '') + '</div>';
    });
    h += '</div></div><div class="finish-bar"><button class="cta-green" id="s-finish">Finalizar treino</button></div>';
    $("session").innerHTML = h;
    bindSession();
  }
  function bindSession() {
    var d = DATA[current], root = $("session");
    $("s-close").onclick = closeSession;
    $("s-menu").onclick = function() {
      actionSheet("Treino " + current, [
        { label: "Reiniciar marcações", fn: function() { clearDayProgress(current); renderSession(); } },
        { label: "Reiniciar cronômetro", fn: function() { SESSION = { day: current, start: Date.now() }; jset(SESSION_KEY, SESSION); renderSession(); } }
      ]);
    };
    $("s-add").onclick = function() {
      openPicker(function(name) {
        var c = cloneTemplate(name); c.name = name; d.exercises.push(c); saveData(); addToCatalog(name); renderSession();
      });
    };
    root.querySelectorAll("[data-chk]").forEach(function(b) {
      b.addEventListener("click", function() {
        var k = b.getAttribute("data-chk"), nowDone = !PROGRESS["done:" + k];
        PROGRESS["done:" + k] = nowDone; saveProgress();
        b.closest(".t-row").classList.toggle("done", nowDone); updateSessionStats();
        if (nowDone) {
          var i = parseInt(k.split(":")[1], 10);
          if (d.exercises[i] && PROGRESS["autorest"] !== false) startTimer(restSeconds(d.exercises[i].interval));
        }
      });
    });
    root.querySelectorAll("[data-kg]").forEach(function(inp) {
      inp.addEventListener("input", function() { PROGRESS["kg:" + inp.getAttribute("data-kg")] = inp.value; saveProgress(); updateSessionStats(); });
    });
    root.querySelectorAll("[data-reps]").forEach(function(inp) {
      inp.addEventListener("input", function() { PROGRESS["reps:" + inp.getAttribute("data-reps")] = inp.value; saveProgress(); updateSessionStats(); });
    });
    root.querySelectorAll("[data-add]").forEach(function(b) {
      b.addEventListener("click", function() {
        var e = d.exercises[parseInt(b.getAttribute("data-add"), 10)];
        e.sets.push(e.sets[e.sets.length - 1] || "8–12"); saveData(); renderSession();
      });
    });
    root.querySelectorAll("[data-all]").forEach(function(b) {
      b.addEventListener("click", function() {
        var i = parseInt(b.getAttribute("data-all"), 10);
        d.exercises[i].sets.forEach(function(r, s) { PROGRESS["done:" + pk(current, i, s)] = true; });
        saveProgress(); renderSession();
      });
    });
    root.querySelectorAll("[data-rest]").forEach(function(b) {
      b.addEventListener("click", function() { startTimer(restSeconds(d.exercises[parseInt(b.getAttribute("data-rest"), 10)].interval)); });
    });
    root.querySelectorAll("[data-smenu]").forEach(function(b) {
      b.addEventListener("click", function() {
        var i = parseInt(b.getAttribute("data-smenu"), 10), e = d.exercises[i];
        actionSheet(e.name, [
          { label: "Ver exercício", fn: function() { openDetail(e); } },
          { label: "Remover do treino", danger: true, fn: function() {
              if (confirm("Remover \"" + e.name + "\" deste treino?")) { d.exercises.splice(i, 1); saveData(); clearDayProgress(current); renderSession(); }
          } }
        ]);
      });
    });
    $("s-finish").onclick = finishSession;
  }
  function clearDayProgress(day) {
    Object.keys(PROGRESS).forEach(function(k) {
      if (k.indexOf("done:" + day + ":") === 0 || k.indexOf("kg:" + day + ":") === 0 || k.indexOf("reps:" + day + ":") === 0) delete PROGRESS[k];
    });
    saveProgress();
  }
  function finishSession() {
    var st = sessionStats();
    if (st.done === 0) { toast("Marque pelo menos uma série"); return; }
    if (!confirm("Finalizar treino e salvar no Progresso?")) return;
    var d = DATA[current];
    HIST.push({ ts: Date.now(), day: current, label: d.label, dur: st.dur, vol: st.vol, sets: st.done, cal: st.cal });
    jset(HIST_KEY, HIST);
    d.exercises.forEach(function(e, i) {
      e.sets.forEach(function(r, s) {
        var k = pk(current, i, s), kg = PROGRESS["kg:" + k], rp = PROGRESS["reps:" + k];
        if (kg || rp) LAST[k] = { kg: kg || "", reps: rp || "" };
      });
    });
    jset(LAST_KEY, LAST);
    clearDayProgress(current);
    SESSION = null; try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
    closeSession(); toast("Treino salvo! 💪"); showPage("prog");
  }

  /* ---------------- Exercícios (biblioteca) ---------------- */
  function renderLib() {
    var all = allUniqueExercises().sort(function(a, b) { return a.name.localeCompare(b.name, "pt-BR"); });
    var list = all.filter(function(e) {
      if (libFilter === "★ Favoritos") { if (!FAVS[e.name]) return false; }
      else if (libFilter !== "Todos" && e.category !== libFilter) return false;

      return true;
    });
    var h = '<div class="topbar"><div class="page-title cond" style="margin:0;">Exercícios</div>'
      + '<button class="icon-btn" id="lib-search-btn">' + ICON.search + '</button></div>';
    if (libSearchOpen) h += '<div class="search-row"><input class="search-input" id="lib-q" placeholder="Buscar exercício..." value="' + esc(libSearch) + '" /></div>';
    h += '<div class="filter-pills">' + ["Todos", "★ Favoritos"].concat(CATEGORIES).map(function(c) {
      return '<button class="fpill' + (libFilter === c ? " active" : "") + '" data-f="' + esc(c) + '">' + esc(c) + '</button>';
    }).join("") + '</div>';
    h += '<div class="count-row"><span>' + list.length + ' exercícios</span><span>Ordem alfabética</span></div>';
    if (!list.length) h += '<div class="empty">Nenhum exercício encontrado.</div>';
    h += '<div class="grid">' + list.map(function(e, i) {
      return '<div class="g-card" data-g="' + i + '"><div class="g-img">'
        + (e.img ? '<img src="' + esc(e.img) + '" alt="" loading="lazy" onerror="this.outerHTML=window.__ph(\'' + esc(e.category) + '\')" />' : bodySvg(e.category, false))
        + '<button class="g-star' + (FAVS[e.name] ? " on" : "") + '" data-star="' + i + '" aria-label="Favoritar">' + ICON.star + '</button></div>'
        + '<div class="g-name">' + esc(e.name) + '</div></div>';
    }).join("") + '</div>';
    $("page-lib").innerHTML = h;

    $("lib-search-btn").onclick = function() { libSearchOpen = !libSearchOpen; if (!libSearchOpen) libSearch = ""; renderLib(); if (libSearchOpen && $("lib-q")) $("lib-q").focus(); };
    if ($("lib-q")) $("lib-q").addEventListener("input", function(ev) {
      libSearch = ev.target.value; var pos = ev.target.selectionStart; renderLib();
      var q = $("lib-q"); q.focus(); try { q.setSelectionRange(pos, pos); } catch (e) {}
    });
    $("page-lib").querySelectorAll("[data-f]").forEach(function(b) { b.addEventListener("click", function() { libFilter = b.getAttribute("data-f"); renderLib(); }); });
    $("page-lib").querySelectorAll("[data-g]").forEach(function(c) {
      c.addEventListener("click", function(ev) {

        openDetail(list[parseInt(c.getAttribute("data-g"), 10)]);
      });
    });
    $("page-lib").querySelectorAll("[data-star]").forEach(function(b) {
      b.addEventListener("click", function() {
        var e = list[parseInt(b.getAttribute("data-star"), 10)];
        if (FAVS[e.name]) delete FAVS[e.name]; else FAVS[e.name] = 1;
        jset(FAV_KEY, FAVS); renderLib();
      });
    });
  }

  /* ---------------- Progresso ---------------- */
  function renderProg() {
    var totalVol = 0, totalSets = 0;
    HIST.forEach(function(x) { totalVol += x.vol; totalSets += x.sets; });
    var h = '<div class="page-title cond">Progresso</div>';
    if (!HIST.length) {
      h += '<div class="empty">Nenhum treino finalizado ainda.<br>Inicie um treino em <b>Meu Plano</b>, marque as séries, anote as cargas e toque em <b>Finalizar treino</b>.</div>';
    } else {
      h += '<div class="tiles"><div class="tile"><div class="v">' + HIST.length + '</div><div class="l">Treinos</div></div>'
        + '<div class="tile"><div class="v">' + totalSets + '</div><div class="l">Séries</div></div>'
        + '<div class="tile"><div class="v">' + (totalVol >= 1000 ? (totalVol / 1000).toFixed(1) + "t" : totalVol + "kg") + '</div><div class="l">Volume total</div></div></div>';
      var recent = HIST.slice(-12), max = 1;
      recent.forEach(function(x) { if (x.vol > max) max = x.vol; });
      var bw = 300 / recent.length, bars = "";
      recent.forEach(function(x, i) {
        var hh = Math.max(3, Math.round((x.vol / max) * 90));
        bars += '<rect x="' + (i * bw + bw * 0.18).toFixed(1) + '" y="' + (100 - hh) + '" width="' + (bw * 0.64).toFixed(1) + '" height="' + hh + '" rx="3" fill="' + (i === recent.length - 1 ? "#b58cff" : "#6b46c1") + '"/>';
      });
      h += '<div class="chart-card"><div class="t">Volume por treino (kg)</div><div class="big">' + recent[recent.length - 1].vol + ' kg</div>'
        + '<svg viewBox="0 0 300 104" width="100%" style="margin-top:10px;">' + bars + '</svg></div>';
      h += '<div class="sec-title cond">Histórico</div>';
      h += HIST.slice().reverse().map(function(x) {
        var dt = new Date(x.ts);
        return '<div class="hist-row"><div><div class="a">' + esc(x.day) + ' · ' + esc(x.label) + '</div><div class="b">' + dt.toLocaleDateString("pt-BR") + ' · ' + fmtTime(x.dur) + ' · ' + x.sets + ' séries</div></div><div class="c">' + x.vol + ' kg</div></div>';
      }).join("");
    }
    $("page-prog").innerHTML = h;
  }

  /* ---------------- Editar ---------------- */
  function renderEdit() {
    var d = DATA[current];
    var h = '<div class="page-title cond">Editar ficha</div>' + dayChipsHtml("data-eday");
    h += '<div class="f-label">Nome do treino</div><input class="f-input" id="e-label" value="' + esc(d.label) + '" />';
    h += '<div id="e-list" style="margin-top:16px;"></div>';
    h += '<button class="dashed-btn" id="e-add">+ Adicionar exercício</button>';
    $("page-edit").innerHTML = h;
    $("page-edit").querySelectorAll("[data-eday]").forEach(function(c) { c.addEventListener("click", function() { current = c.getAttribute("data-eday"); renderEdit(); }); });
    $("e-label").addEventListener("input", function(ev) { d.label = ev.target.value; saveData(); });
    $("e-add").onclick = function() { openPicker(function(name) { var c = cloneTemplate(name); c.name = name; d.exercises.push(c); saveData(); addToCatalog(name); renderEdit(); }); };
    var host = $("e-list");
    d.exercises.forEach(function(e, i) { host.appendChild(editCard(e, i, d.exercises)); });
  }
  function el(tag, cls, html) { var x = document.createElement(tag); if (cls) x.className = cls; if (html != null) x.innerHTML = html; return x; }
  function editCard(e, i, list) {
    var card = el("div", "e-card");
    function lbl(t) { card.appendChild(el("div", "f-label", t)); }
    function selectOf(options, value, onchange) {
      var s = el("select", "f-select");
      options.forEach(function(o) { var op = document.createElement("option"); op.value = o; op.textContent = o; if (o === value) op.selected = true; s.appendChild(op); });
      s.onchange = function() { onchange(s.value); }; return s;
    }
    function inputOf(value, onin, ph) { var x = el("input", "f-input"); x.value = value; if (ph) x.placeholder = ph; x.oninput = function() { onin(x.value); }; return x; }

    if (CATALOG.indexOf(e.name) < 0) addToCatalog(e.name);
    lbl("Exercício");
    var NEW = "+ Cadastrar novo exercício";
    card.appendChild(selectOf(CATALOG.concat([NEW]), e.name, function(v) {
      if (v === NEW) {
        var nm = prompt("Nome do novo exercício:");
        if (nm && nm.trim()) { e.name = nm.trim(); addToCatalog(e.name); saveData(); renderEdit(); } else renderEdit();
      } else { e.name = v; saveData(); }
    }));
    lbl("Foco / músculo"); card.appendChild(inputOf(e.focus, function(v) { e.focus = v; saveData(); }));
    lbl("Categoria (para a biblioteca)"); card.appendChild(selectOf(CATEGORIES, e.category, function(v) { e.category = v; saveData(); }));
    lbl("Pegada"); card.appendChild(selectOf(GRIPS, e.grip, function(v) { e.grip = v; saveData(); }));

    lbl("Imagem ou GIF (link direto .jpg, .png ou .gif)");
    var imgIn = inputOf(e.img, function(v) { e.img = v; saveData(); previewImg(); }, "https://...");
    var imgHint = el("div", "hint");
    function previewImg() {
      imgHint.className = "hint"; imgHint.innerHTML = "";
      if (!imgIn.value) return;
      var t = new Image();
      t.onload = function() { imgHint.className = "hint ok"; imgHint.textContent = "✓ imagem carregada"; imgHint.appendChild(t); };
      t.onerror = function() { imgHint.className = "hint bad"; imgHint.textContent = "✕ não carregou — precisa ser um link direto de imagem/gif (termina em .jpg, .png, .gif), não o link de uma página"; };
      t.src = imgIn.value;
    }
    card.appendChild(imgIn); card.appendChild(imgHint); previewImg();

    lbl("Vídeo (link completo do YouTube)");
    var vidIn = inputOf(e.video, function(v) { e.video = v; saveData(); previewVid(); }, "https://youtube.com/watch?v=...");
    var vidHint = el("div", "hint");
    function previewVid() {
      if (!vidIn.value) { vidHint.className = "hint"; vidHint.textContent = ""; return; }
      var ok = !!getYouTubeId(vidIn.value);
      vidHint.className = "hint " + (ok ? "ok" : "bad");
      vidHint.textContent = ok ? "✓ link reconhecido" : "✕ não reconhecido — cole a URL completa (youtube.com/watch?v=... ou youtu.be/...)";
    }
    card.appendChild(vidIn); card.appendChild(vidHint); previewVid();

    lbl("Séries (reps por série)");
    var row = el("div", "set-edit-row"); card.appendChild(row);
    function drawSets() {
      row.innerHTML = "";
      e.sets.forEach(function(r, s) {
        var w = el("div", "set-edit"), inp = el("input"); inp.value = r;
        inp.oninput = function() { e.sets[s] = inp.value; saveData(); };
        var rm = el("button", "rm-set", "✕");
        rm.onclick = function() { if (e.sets.length > 1) { e.sets.splice(s, 1); saveData(); drawSets(); } };
        w.appendChild(inp); w.appendChild(rm); row.appendChild(w);
      });
      var add = el("button", "add-set-btn", "+");
      add.onclick = function() { e.sets.push(e.sets[e.sets.length - 1] || "8–12"); saveData(); drawSets(); };
      row.appendChild(add);
    }
    drawSets();

    lbl("Intervalo"); card.appendChild(inputOf(e.interval, function(v) { e.interval = v; saveData(); }));
    lbl("Técnica (opcional)"); card.appendChild(inputOf(e.tech, function(v) { e.tech = v; saveData(); }));
    lbl("Execução / observação");
    var ta = el("textarea", "f-area"); ta.value = e.exec; ta.oninput = function() { e.exec = ta.value; saveData(); }; card.appendChild(ta);

    var act = el("div", "e-actions");
    var up = el("button", "", "▲ Subir"), dn = el("button", "", "▼ Descer"), del = el("button", "danger", "🗑 Excluir");
    up.onclick = function() { if (i > 0) { var t = list[i - 1]; list[i - 1] = list[i]; list[i] = t; saveData(); renderEdit(); } };
    dn.onclick = function() { if (i < list.length - 1) { var t = list[i + 1]; list[i + 1] = list[i]; list[i] = t; saveData(); renderEdit(); } };
    del.onclick = function() { if (confirm("Excluir \"" + e.name + "\" deste treino?")) { list.splice(i, 1); saveData(); renderEdit(); } };
    act.appendChild(up); act.appendChild(dn); act.appendChild(del); card.appendChild(act);
    return card;
  }

  /* ---------------- Ajustes ---------------- */
  function renderAjustes() {
    var h = '<div class="page-title cond">Ajustes</div>'
      + '<div class="sec-title cond" style="margin-top:6px;">Backup da ficha</div>'
      + '<div class="btn-row"><button class="btn-soft" id="a-export">⤓ Exportar</button>'
      + '<label class="btn-soft" for="a-import" style="cursor:pointer;">⤒ Importar</label><input type="file" id="a-import" accept="application/json" hidden /></div>'
      + '<div class="note">Seus dados ficam salvos <b>neste navegador deste aparelho</b>. Para levar a ficha para outro celular ou computador, exporte aqui e importe lá.</div>'
      + '<div class="sec-title cond">Zona de risco</div>'
      + '<div class="btn-row"><button class="btn-soft danger" id="a-restore">⟲ Restaurar ficha padrão</button>'
      + '<button class="btn-soft danger" id="a-clearhist">Apagar histórico</button></div>'
      + '<div class="note"><b>Dica:</b> toque em Compartilhar (iPhone) ou no menu ⋮ (Android) e escolha "Adicionar à Tela de Início" para abrir como app.</div>';
    $("page-aj").innerHTML = h;
    $("a-export").onclick = function() {
      var blob = new Blob([JSON.stringify(DATA, null, 2)], { type: "application/json" });
      var url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = "ficha_treino.json"; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    };
    $("a-import").onchange = function(ev) {
      var f = ev.target.files[0]; if (!f) return;
      var rd = new FileReader();
      rd.onload = function() {
        try {
          var p = JSON.parse(rd.result);
          if (ORDER.every(function(c) { return p[c] && Array.isArray(p[c].exercises); })) {
            DATA = p; saveData();
            Object.keys(DATA).forEach(function(c) { DATA[c].exercises.forEach(function(e) { if (!e.category) e.category = inferCategory(e); if (e.img === undefined) e.img = ""; if (e.video === undefined) e.video = ""; if (!e.grip) e.grip = "—"; addToCatalog(e.name); }); });
            saveData(); toast("Ficha importada!");
          } else alert("Arquivo inválido — não parece uma ficha exportada por este app.");
        } catch (err) { alert("Não consegui ler esse arquivo JSON."); }
      };
      rd.readAsText(f); ev.target.value = "";
    };
    $("a-restore").onclick = function() {
      if (confirm("Isso substitui a ficha atual pelo padrão original. Deseja continuar?")) { DATA = defaultData(); saveData(); PROGRESS = {}; saveProgress(); toast("Ficha restaurada"); }
    };
    $("a-clearhist").onclick = function() {
      if (confirm("Apagar todo o histórico de treinos?")) { HIST = []; jset(HIST_KEY, HIST); toast("Histórico apagado"); }
    };
  }

  showPage("plano");
})();
</script>
</body>
</html>
