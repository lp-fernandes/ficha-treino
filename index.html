<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#121216" />
<title>Ficha de Treino</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; padding:0; background:#121216; color:#f0efec;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
  :root {
    --bg:#121216; --bg-card:#1c1c22; --bg-card2:#212128; --bg-input:#17171c; --line:#2a2a32;
    --text:#f0efec; --text-dim:#8d8b93; --text-dim2:#5f5d66;
    --gold:#e0ab4a; --gold-dim:#8a6a2c; --gold-glow:rgba(224,171,74,0.18);
    --tag-tech:#e0694f; --tag-tech-bg:#3a221c;
    --blue:#5b9bd5; --blue-bg:#1c2c3a;
    --green:#5ec98a; --green-dk:#0d1f15;
    --radius:14px; --radius-sm:9px;
  }
  #root { max-width:480px; margin:0 auto; padding:env(safe-area-inset-top,16px) 14px calc(96px + env(safe-area-inset-bottom,0px)); }

  .header { display:flex; align-items:center; gap:10px; padding:2px 2px 16px; }
  .logo { width:34px; height:34px; border-radius:10px; background:linear-gradient(145deg,#e0ab4a,#a9752a);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .logo svg { width:19px; height:19px; }
  .header-text h1 { font-size:16px; font-weight:800; letter-spacing:-0.01em; margin:0; line-height:1.1; }
  .header-text .sub { font-size:11px; color:var(--text-dim); margin-top:2px; }

  .tabs { display:flex; gap:7px; margin-bottom:14px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { flex:1; min-width:58px; background:var(--bg-card); border:1px solid var(--line); border-radius:12px;
    padding:9px 4px; text-align:center; cursor:pointer; transition:all .15s ease; }
  .tab .day { font-size:9.5px; color:var(--text-dim2); letter-spacing:0.06em; font-weight:600; }
  .tab .code { font-size:15px; font-weight:800; color:var(--text); margin-top:2px; }
  .tab.active { border-color:var(--gold); background:var(--gold-glow); }
  .tab.active .day, .tab.active .code { color:var(--gold); }

  .day-title { font-size:14px; color:var(--text-dim); margin:0 2px 8px; display:flex; align-items:center; gap:8px; }
  .day-title strong { color:var(--text); font-weight:800; }
  .day-title input { flex:1; background:var(--bg-input); border:1px solid var(--line); color:var(--text);
    font-size:13px; padding:7px 9px; border-radius:8px; }
  .progress-wrap { margin:0 2px 16px; }
  .progress-track { height:6px; border-radius:6px; background:var(--bg-card2); overflow:hidden; }
  .progress-fill { height:100%; border-radius:6px; background:linear-gradient(90deg,#e0ab4a,#f0c874); transition:width .3s ease; }
  .progress-label { font-size:10px; color:var(--text-dim2); margin-top:5px; text-align:right; }

  .ex-card { background:var(--bg-card); border:1px solid var(--line); border-radius:var(--radius);
    padding:13px 14px; margin-bottom:10px; box-shadow:0 3px 10px rgba(0,0,0,0.18); }
  .ex-top-row { display:flex; gap:10px; align-items:flex-start; cursor:pointer; }
  .ex-thumb-sm { width:52px; height:52px; border-radius:10px; object-fit:cover; flex-shrink:0;
    background:var(--bg-input); border:1px solid var(--line); }
  .ex-thumb-ph { width:52px; height:52px; border-radius:10px; flex-shrink:0; background:var(--bg-input);
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--text-dim2); }
  .ex-thumb-ph svg { width:22px; height:22px; }
  .ex-top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; flex:1; }
  .ex-name { font-size:14px; font-weight:700; line-height:1.25; }
  .ex-focus-row { display:flex; align-items:center; gap:6px; margin-top:3px; flex-wrap:wrap; }
  .ex-focus { font-size:11px; color:var(--gold-dim); font-weight:600; }
  .grip-chip { font-size:9.5px; color:var(--blue); background:var(--blue-bg); border-radius:5px; padding:2px 6px; font-weight:700; }
  .cat-chip { font-size:9.5px; color:var(--text-dim); background:var(--bg-card2); border-radius:5px; padding:2px 6px; font-weight:700; }
  .ex-num { font-size:10.5px; color:var(--text-dim2); min-width:20px; height:20px; border-radius:6px;
    background:var(--bg-card2); display:flex; align-items:center; justify-content:center; font-weight:700; }
  .chevron { color:var(--text-dim2); flex-shrink:0; align-self:center; }

  .set-table { margin-top:11px; border-radius:12px; overflow:hidden; background:var(--bg-input); border:1px solid var(--line); }
  .set-table-head { display:grid; grid-template-columns:34px 1fr 72px 40px; gap:4px; padding:7px 10px;
    font-size:9px; color:var(--text-dim2); letter-spacing:0.05em; font-weight:700; }
  .set-row { display:grid; grid-template-columns:34px 1fr 72px 40px; gap:4px; align-items:center;
    padding:7px 10px; border-top:1px solid var(--line); transition:background .15s ease; }
  .set-row.done { background:rgba(94,201,138,0.12); }
  .set-row .set-label { font-size:12px; font-weight:700; color:var(--text-dim); }
  .set-row .set-reps { font-size:12.5px; font-weight:700; }
  .set-row .set-reps .tech-mini { display:block; font-size:8.5px; font-weight:600; color:var(--tag-tech); margin-top:1px; }
  .set-row .kg-input-table { width:100%; background:var(--bg-card); border:1px solid var(--line); color:var(--text);
    font-size:12px; text-align:center; padding:6px 2px; border-radius:7px; }
  .set-row .kg-input-table::placeholder { color:var(--text-dim2); }
  .check-circle { width:28px; height:28px; border-radius:50%; border:1.5px solid var(--line); background:var(--bg-card2);
    color:transparent; font-size:14px; font-weight:800; display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:all .15s ease; justify-self:center; }
  .check-circle.done { background:var(--green); border-color:var(--green); color:var(--green-dk); }
  .set-actions-row { display:flex; gap:14px; padding:8px 10px 2px; }
  .set-actions-row button { background:none; border:none; color:var(--gold-dim); font-size:10.5px; font-weight:700;
    cursor:pointer; padding:2px 0; }
  .finalize-btn { display:block; width:100%; margin-top:6px; padding:15px; border-radius:16px; border:none;
    background:linear-gradient(135deg,var(--green),#3fa86b); color:var(--green-dk); font-size:14px; font-weight:800;
    letter-spacing:0.02em; cursor:pointer; box-shadow:0 6px 18px rgba(94,201,138,0.25); }

  .meta-row { display:flex; align-items:center; justify-content:space-between; margin-top:9px; gap:6px; flex-wrap:wrap; }
  .meta-left { font-size:10.5px; color:var(--text-dim); line-height:1.35; }
  .pill-btn-group { display:flex; gap:6px; flex-shrink:0; }
  .pill-btn { display:flex; align-items:center; gap:4px; background:var(--bg-card2);
    border:1px solid var(--line); color:var(--gold); font-size:11px; font-weight:700; padding:6px 10px;
    border-radius:20px; cursor:pointer; }
  .pill-btn svg { width:12px; height:12px; }
  .exec { font-size:10.5px; color:var(--text-dim2); margin-top:6px; line-height:1.35; }

  /* ---- library tab ---- */
  .chip-row { display:flex; gap:7px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px; scrollbar-width:none; }
  .chip-row::-webkit-scrollbar { display:none; }
  .filter-chip { flex-shrink:0; background:var(--bg-card); border:1px solid var(--line); color:var(--text-dim);
    font-size:12px; font-weight:700; padding:8px 14px; border-radius:20px; cursor:pointer; white-space:nowrap; }
  .filter-chip.active { background:var(--gold-glow); border-color:var(--gold); color:var(--gold); }
  .lib-row { display:flex; align-items:center; gap:12px; background:var(--bg-card); border:1px solid var(--line);
    border-radius:var(--radius); padding:10px 12px; margin-bottom:9px; cursor:pointer; }
  .lib-row-text { flex:1; min-width:0; }
  .lib-row-name { font-size:13.5px; font-weight:700; }
  .lib-row-sub { font-size:10.5px; color:var(--text-dim2); margin-top:2px; }
  .lib-empty { text-align:center; color:var(--text-dim2); font-size:12px; padding:40px 10px; }

  /* ---- detail screen ---- */
  .detail-screen { position:fixed; inset:0; background:var(--bg); z-index:70; display:none;
    flex-direction:column; }
  .detail-screen.show { display:flex; }
  .detail-head { display:flex; align-items:center; gap:10px; padding:calc(env(safe-area-inset-top,16px) + 6px) 14px 12px;
    border-bottom:1px solid var(--line); flex-shrink:0; }
  .detail-back { width:34px; height:34px; border-radius:50%; background:var(--bg-card2); border:none;
    color:var(--text); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .detail-head h2 { font-size:15px; font-weight:800; margin:0; flex:1; }
  .detail-body { flex:1; overflow-y:auto; padding:16px 14px calc(30px + env(safe-area-inset-bottom,0px)); max-width:480px; margin:0 auto; width:100%; }
  .detail-media { width:100%; border-radius:14px; overflow:hidden; background:var(--bg-card); margin-bottom:14px; }
  .detail-media img { width:100%; display:block; max-height:260px; object-fit:cover; }
  .detail-media .video-box { aspect-ratio:16/9; background:#000; }
  .detail-media .video-box iframe { width:100%; height:100%; border:0; }
  .detail-media-tabs { display:flex; gap:6px; margin-bottom:10px; }
  .detail-media-tabs button { flex:1; padding:7px; border-radius:9px; border:1px solid var(--line); background:var(--bg-card2);
    color:var(--text-dim); font-size:11px; font-weight:700; cursor:pointer; }
  .detail-media-tabs button.active { border-color:var(--gold); color:var(--gold); background:var(--gold-glow); }
  .detail-no-media { text-align:center; color:var(--text-dim2); font-size:11.5px; padding:40px 10px; background:var(--bg-card);
    border-radius:14px; margin-bottom:14px; }
  .detail-chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .detail-section-title { font-size:9px; color:var(--text-dim2); letter-spacing:0.05em; text-transform:uppercase;
    font-weight:700; margin:14px 0 6px; }
  .detail-exec { font-size:12.5px; color:var(--text-dim); line-height:1.5; }
  .detail-sets { border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--bg-input); }

  #timer-bar { position:fixed; left:0; right:0; bottom:calc(74px + env(safe-area-inset-bottom,0px));
    display:flex; justify-content:center; pointer-events:none; z-index:80; opacity:0; transform:translateY(8px);
    transition:opacity .2s ease, transform .2s ease; }
  #timer-bar.show { opacity:1; transform:translateY(0); pointer-events:auto; }
  .timer-pill { display:flex; align-items:center; gap:12px; background:#1c1c22; border:1px solid var(--gold-dim);
    border-radius:30px; padding:8px 10px 8px 16px; box-shadow:0 6px 20px rgba(0,0,0,0.4); }
  .timer-time { font-size:17px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--gold); min-width:52px; }
  .timer-pill button { width:32px; height:32px; border-radius:50%; border:none; background:var(--bg-card2);
    color:var(--text); font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .timer-pill button.close { background:none; color:var(--text-dim2); }

  #bottom-nav { position:fixed; left:0; right:0; bottom:0; background:rgba(18,18,22,0.92);
    backdrop-filter:blur(14px); border-top:1px solid var(--line); display:flex; justify-content:center;
    padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px)); z-index:30; }
  .nav-inner { display:flex; gap:6px; max-width:480px; width:100%; }
  .nav-btn { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 4px;
    border-radius:12px; background:none; border:none; color:var(--text-dim2); cursor:pointer; }
  .nav-btn svg { width:20px; height:20px; }
  .nav-btn .lbl { font-size:10px; font-weight:700; }
  .nav-btn.active { color:var(--gold); }
  .nav-btn.active .icon-bg { background:var(--gold-glow); }
  .icon-bg { width:36px; height:22px; border-radius:10px; display:flex; align-items:center; justify-content:center; }

  .field-label { font-size:9px; color:var(--text-dim2); letter-spacing:0.05em; margin:9px 0 4px; text-transform:uppercase; font-weight:700; }
  .edit-input, .edit-textarea, .edit-select { width:100%; background:var(--bg-input); border:1px solid var(--line); color:var(--text);
    font-size:13px; padding:8px 10px; border-radius:9px; font-family:inherit; }
  .edit-input.name-input { font-size:14.5px; font-weight:700; }
  .edit-textarea { resize:vertical; min-height:40px; }
  .set-edit-row { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; align-items:flex-end; }
  .set-edit { display:flex; flex-direction:column; align-items:center; gap:3px; }
  .set-edit input { width:64px; background:var(--bg-input); border:1px solid var(--line); color:var(--text);
    font-size:12px; text-align:center; padding:7px 3px; border-radius:7px; }
  .set-edit .rm-set { background:none; border:none; color:var(--tag-tech); font-size:15px; cursor:pointer; padding:0; }
  .add-set-btn { background:var(--bg-input); border:1px dashed var(--line); color:var(--text-dim); font-size:18px;
    width:36px; height:36px; border-radius:8px; cursor:pointer; align-self:flex-start; margin-top:17px; }
  .ex-actions { display:flex; gap:6px; margin-top:11px; }
  .ex-actions button { flex:1; font-size:11px; padding:8px 4px; border-radius:8px; border:1px solid var(--line);
    background:var(--bg-input); color:var(--text-dim); cursor:pointer; font-weight:600; }
  .ex-actions button.danger { color:var(--tag-tech); border-color:#4a2724; }
  .add-ex-btn { display:block; width:100%; margin-top:6px; padding:14px; border-radius:var(--radius);
    border:1.5px dashed var(--gold-dim); background:none; color:var(--gold); font-size:13.5px; font-weight:700; cursor:pointer; }

  .toolbar { display:flex; gap:6px; margin-top:16px; flex-wrap:wrap; }
  .toolbar button, .toolbar label { flex:1; min-width:100px; text-align:center; font-size:11px; padding:10px 4px;
    border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--bg-card); color:var(--text-dim);
    cursor:pointer; font-weight:600; }
  .toolbar input[type="file"] { display:none; }
  .toolbar .danger-btn { color:var(--tag-tech); border-color:#4a2724; }
  .footer-note { font-size:10px; color:var(--text-dim2); text-align:center; margin-top:14px; padding:0 8px; line-height:1.4; }
  .install-tip { font-size:10.5px; color:var(--text-dim); background:var(--bg-card); border:1px solid var(--line);
    border-radius:var(--radius); padding:10px 12px; margin-top:14px; line-height:1.4; }
  .install-tip strong { color:var(--gold); }
  .day-select-row { margin-bottom:10px; }
</style>
</head>
<body>
<div id="root">
  <div class="header">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#121216" stroke-width="2.4" stroke-linecap="round"><path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/></svg></div>
    <div class="header-text">
      <h1 id="screen-title">Ficha de Treino</h1>
      <div class="sub" id="screen-sub">Hipertrofia · V-Shape</div>
    </div>
  </div>

  <div id="tab-treino">
    <div class="tabs" id="tabs"></div>
    <div class="day-title" id="day-title"></div>
    <div class="progress-wrap" id="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      <div class="progress-label" id="progress-label">0/0 séries</div>
    </div>
    <div id="exercises"></div>
  </div>

  <div id="tab-biblioteca" style="display:none;">
    <div class="chip-row" id="lib-chips"></div>
    <div id="lib-list"></div>
  </div>

  <div id="tab-editar" style="display:none;">
    <div class="day-title" id="day-title-edit"></div>
    <div class="tabs" id="tabs-edit"></div>
    <div id="exercises-edit"></div>
    <div id="editar-footer">
      <div class="toolbar">
        <button id="export-btn">⤓ Exportar ficha</button>
        <label for="import-input">⤒ Importar ficha</label>
        <input type="file" id="import-input" accept="application/json" />
        <button class="danger-btn" id="restore-btn">⟲ Restaurar padrão</button>
      </div>
      <div class="footer-note">As alterações são salvas automaticamente neste navegador.</div>
    </div>
  </div>

  <div id="treino-footer">
    <button id="reset-btn" style="width:100%;margin-top:2px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg-card);color:var(--text-dim);font-size:12px;font-weight:700;">Reiniciar marcações do dia</button>
    <div class="install-tip"><strong>Dica:</strong> toque em Compartilhar (iPhone) ou no menu ⋮ (Android) e escolha "Adicionar à Tela de Início".</div>
  </div>
</div>

<div class="detail-screen" id="detail-screen">
  <div class="detail-head">
    <button class="detail-back" id="detail-back">←</button>
    <h2 id="detail-name">Exercício</h2>
  </div>
  <div class="detail-body" id="detail-body"></div>
</div>

<div id="timer-bar">
  <div class="timer-pill">
    <div class="timer-time" id="timer-time">00:00</div>
    <button id="timer-toggle">⏸</button>
    <button class="close" id="timer-close">✕</button>
  </div>
</div>

<div id="bottom-nav">
  <div class="nav-inner">
    <button class="nav-btn active" id="nav-treino">
      <div class="icon-bg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/></svg></div>
      <div class="lbl">Treino</div>
    </button>
    <button class="nav-btn" id="nav-biblioteca">
      <div class="icon-bg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="15" width="7" height="7" rx="1.5"/><rect x="14" y="15" width="7" height="7" rx="1.5"/></svg></div>
      <div class="lbl">Exercícios</div>
    </button>
    <button class="nav-btn" id="nav-editar">
      <div class="icon-bg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></div>
      <div class="lbl">Editar</div>
    </button>
  </div>
</div>

<script>
(function() {
  const ORDER = ["A1","B1","C","A2","B2"];
  const DATA_KEY = "ficha_treino_data_v5";
  const PROGRESS_KEY = "ficha_treino_progress_v5";
  const CATALOG_KEY = "ficha_treino_catalog_v1";
  const GRIPS = ["—","Pronada","Supinada","Neutra"];
  const CATEGORIES = ["Costas","Peito","Ombros","Bíceps","Tríceps","Pernas","Core","Outros"];
  const NEW_OPTION = "__novo__";

  function ex(name, focus, sets, interval, tech, exec, grip, img, video, category) {
    return { name, focus, sets, interval, tech: tech || "", exec: exec || "", grip: grip || "—",
      img: img || "", video: video || "", category: category || "Outros" };
  }

  function defaultData() {
    return {
      A1: { day:"SEG", label:"Costas (Largura) + Bíceps", exercises:[
        ex("Puxada Alta Pronada Aberta","Costas — largura",["15–20","10–15","8–12","6–10"],"2–3 min","Última: rest-pause","Cotovelos para os bolsos, alongamento total no topo.","Pronada","","","Costas"),
        ex("High Row Máquina","Costas — largura/espessura",["8–10","8–10","8–10","8–10"],"90s–2min","Segurar 2s","Peito apoiado, cotovelos para baixo e para trás.","Neutra","","","Costas"),
        ex("Remada Máquina Guiada","Costas — espessura",["8–10","8–10","8–10"],"90s","Pico contração 2s","Excêntrica de 3s.","Pronada","","","Costas"),
        ex("Remada Unilateral Máquina","Corrigir assimetrias",["10–12","10–12","10–12"],"60–90s","","Não gire o tronco, cotovelo passa a linha do corpo.","Neutra","","","Costas"),
        ex("Reverse Fly Máquina","Deltoide posterior",["12–15","12–15","12–15"],"45s","Última: drop set","Abra os cotovelos, sem elevar os ombros.","Neutra","","","Ombros"),
        ex("Rosca Scott Máquina","Bíceps — pico",["8–10","8–10","8–10"],"60s","Última: drop set","Braço 100% apoiado, sem tirar o cotovelo.","Supinada","","","Bíceps"),

  function inferCategory(exItem) {
    const t = ((exItem.focus||"") + " " + (exItem.name||"")).toLowerCase();
    if (t.indexOf("peito") >= 0) return "Peito";
    if (t.indexOf("costas") >= 0 || t.indexOf("dorsal") >= 0) return "Costas";
    if (t.indexOf("deltoide") >= 0 || t.indexOf("ombro") >= 0) return "Ombros";
    if (t.indexOf("bíceps") >= 0 || t.indexOf("braquial") >= 0) return "Bíceps";
    if (t.indexOf("tríceps") >= 0) return "Tríceps";
    if (t.indexOf("quadríceps") >= 0 || t.indexOf("posterior") >= 0 || t.indexOf("glúteo") >= 0 || t.indexOf("panturrilha") >= 0 || t.indexOf("isquio") >= 0) return "Pernas";
    if (t.indexOf("core") >= 0 || t.indexOf("abdom") >= 0) return "Core";
    return "Outros";
  }

  function loadData() {
    let d;
    try { const raw = localStorage.getItem(DATA_KEY); d = raw ? JSON.parse(raw) : null; } catch (e) { d = null; }
    if (!d) { d = defaultData(); saveData(d); return d; }
    let migrated = false;
    Object.keys(d).forEach(code => {
      d[code].exercises.forEach(e => {
        if (e.category === undefined) { e.category = inferCategory(e); migrated = true; }
        if (e.img === undefined) { e.img = ""; migrated = true; }
        if (e.video === undefined) { e.video = ""; migrated = true; }
        if (e.grip === undefined) { e.grip = "—"; migrated = true; }
      });
    });
    if (migrated) saveData(d);
    return d;
  }
  function saveData(d) { try { localStorage.setItem(DATA_KEY, JSON.stringify(d)); } catch (e) {} }
  function loadProgress() {
    try { const raw = localStorage.getItem(PROGRESS_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
    return {};
  }
  function saveProgress() { try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(PROGRESS)); } catch (e) {} }
  function loadCatalog() {
    try { const raw = localStorage.getItem(CATALOG_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
    const names = new Set();
    Object.values(DATA).forEach(d => d.exercises.forEach(e => names.add(e.name)));
    const arr = Array.from(names).sort((a,b) => a.localeCompare(b, "pt-BR"));
    saveCatalog(arr);
    return arr;
  }
  function saveCatalog(arr) { try { localStorage.setItem(CATALOG_KEY, JSON.stringify(arr)); } catch (e) {} }
  function addToCatalog(name) {
    if (!name || CATALOG.includes(name)) return;
    CATALOG.push(name);
    CATALOG.sort((a,b) => a.localeCompare(b, "pt-BR"));
    saveCatalog(CATALOG);
  }

  function fmt(s) { const m = Math.floor(s/60), r = s%60; return (m<10?"0":"")+m+":"+(r<10?"0":"")+r; }
  function parseRestSeconds(str) {
    const re = /(\d+)\s*(min|s)/gi;
    let match, last = null;
    while ((match = re.exec(str)) !== null) last = match;
    if (!last) return 60;
    const val = parseInt(last[1], 10);
    return last[2].toLowerCase() === "min" ? val * 60 : val;
  }
  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = 880;
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
      o.start(); o.stop(ctx.currentTime + 0.55);
    } catch (e) {}
    if (navigator.vibrate) navigator.vibrate([120,60,120]);
  }
  function startTimer(seconds) {
    clearInterval(timerHandle);
    timerRemaining = seconds; timerPaused = false;
    timerTime.textContent = fmt(timerRemaining);
    timerToggle.textContent = "⏸";
    timerBar.classList.add("show");
    timerHandle = setInterval(() => {
      if (timerPaused) return;
      timerRemaining--;
      if (timerRemaining <= 0) {
        clearInterval(timerHandle);
        timerTime.textContent = "00:00";
        beep();
        setTimeout(() => timerBar.classList.remove("show"), 900);
        return;
      }
      timerTime.textContent = fmt(timerRemaining);
    }, 1000);
  }
  timerToggle.onclick = () => { timerPaused = !timerPaused; timerToggle.textContent = timerPaused ? "▶" : "⏸"; };
  timerClose.onclick = () => { clearInterval(timerHandle); timerBar.classList.remove("show"); };

      row.innerHTML = (exItem.img
          ? '<img class="ex-thumb-sm" src="' + exItem.img + '" alt="" loading="lazy" onerror="this.outerHTML=\'<div class=&quot;ex-thumb-ph&quot;>🏋</div>\'" />'
          : '<div class="ex-thumb-ph">🏋</div>')
        + '<div class="lib-row-text"><div class="lib-row-name">' + exItem.name + '</div>'
        + '<div class="lib-row-sub">' + exItem.category + ' · ' + exItem.sets.length + ' séries</div></div>'
        + '<span class="chevron">›</span>';
      row.onclick = () => openDetail(exItem, "biblioteca");
      libList.appendChild(row);
    });
  }

  // ---- Editar tab ----
  function renderEditDayTitle() {
    const d = DATA[current];
    titleEditEl.innerHTML = "";
    const strong = document.createElement("strong"); strong.textContent = current;
    const input = document.createElement("input");
    input.value = d.label;
    input.oninput = () => { d.label = input.value; saveData(DATA); };
    titleEditEl.appendChild(strong); titleEditEl.appendChild(input);
  }
  function renderEditTabs() {
    tabsEditEl.innerHTML = "";
    ORDER.forEach(code => {
      const d = DATA[code];
      const tab = document.createElement("div");
      tab.className = "tab" + (code === current ? " active" : "");
      tab.innerHTML = '<div class="day">' + d.day + '</div><div class="code">' + code + '</div>';
      tab.onclick = () => { current = code; renderEditar(); };
      tabsEditEl.appendChild(tab);
    });
  }

  function renderEditCard(exItem, i, list) {
    const card = document.createElement("div");
    card.className = "ex-card";

    const nameLbl = document.createElement("div"); nameLbl.className="field-label"; nameLbl.textContent="Exercício";
    const nameSelect = document.createElement("select"); nameSelect.className="edit-select";
    if (!CATALOG.includes(exItem.name)) addToCatalog(exItem.name);
    CATALOG.forEach(n => {
      const opt = document.createElement("option"); opt.value = n; opt.textContent = n;
      if (exItem.name === n) opt.selected = true;
      nameSelect.appendChild(opt);
    });
    const newOpt = document.createElement("option"); newOpt.value = NEW_OPTION; newOpt.textContent = "+ Cadastrar novo exercício";
    nameSelect.appendChild(newOpt);
    nameSelect.onchange = () => {
      if (nameSelect.value === NEW_OPTION) {
        const newName = prompt("Nome do novo exercício:");
        if (newName && newName.trim()) {
          exItem.name = newName.trim();
          addToCatalog(exItem.name);
          saveData(DATA); renderEditar();
        } else { nameSelect.value = exItem.name; }
      } else { exItem.name = nameSelect.value; saveData(DATA); }
    };

    const focusLbl = document.createElement("div"); focusLbl.className="field-label"; focusLbl.textContent="Foco / músculo";
    const focusInput = document.createElement("input"); focusInput.className="edit-input"; focusInput.value=exItem.focus;
    focusInput.oninput = () => { exItem.focus = focusInput.value; saveData(DATA); };

    const catLbl = document.createElement("div"); catLbl.className="field-label"; catLbl.textContent="Categoria (pra biblioteca)";
    const catSelect = document.createElement("select"); catSelect.className="edit-select";
    CATEGORIES.forEach(c => {
      const opt = document.createElement("option"); opt.value = c; opt.textContent = c;
      if (exItem.category === c) opt.selected = true;
      catSelect.appendChild(opt);
    });
    catSelect.onchange = () => { exItem.category = catSelect.value; saveData(DATA); };

    const gripLbl = document.createElement("div"); gripLbl.className="field-label"; gripLbl.textContent="Pegada";
    const gripSelect = document.createElement("select"); gripSelect.className="edit-select";
    GRIPS.forEach(g => {
      const opt = document.createElement("option"); opt.value = g; opt.textContent = g;
      if (exItem.grip === g) opt.selected = true;
      gripSelect.appendChild(opt);
    });
    gripSelect.onchange = () => { exItem.grip = gripSelect.value; saveData(DATA); };

    const imgLbl = document.createElement("div"); imgLbl.className="field-label"; imgLbl.textContent="Imagem ou GIF (link direto — .jpg, .png ou .gif)";
    const imgInput = document.createElement("input"); imgInput.className="edit-input"; imgInput.placeholder="https://..."; imgInput.value=exItem.img;
    const imgPreview = document.createElement("div"); imgPreview.style.cssText = "margin-top:6px;font-size:10.5px;color:var(--text-dim2);";
    function updateImgPreview() {
      imgPreview.innerHTML = "";
      if (!imgInput.value) { imgPreview.textContent = ""; return; }
      const testImg = document.createElement("img");
      testImg.src = imgInput.value;
      testImg.style.cssText = "max-height:70px;border-radius:6px;display:block;margin-top:2px;";
      testImg.onload = () => { imgPreview.innerHTML = "✓ imagem carregada"; imgPreview.style.color = "var(--gold)"; imgPreview.appendChild(testImg); };
      testImg.onerror = () => { imgPreview.innerHTML = "✕ não carregou — precisa ser um link direto de imagem/gif (termina em .jpg, .png, .gif), não o link de uma página"; imgPreview.style.color = "var(--tag-tech)"; };
    }
    imgInput.oninput = () => { exItem.img = imgInput.value; saveData(DATA); updateImgPreview(); };
    updateImgPreview();

    const vidLbl = document.createElement("div"); vidLbl.className="field-label"; vidLbl.textContent="Vídeo (link completo do YouTube, opcional)";
    const vidInput = document.createElement("input"); vidInput.className="edit-input"; vidInput.placeholder="https://youtube.com/watch?v=..."; vidInput.value=exItem.video;
    const vidPreview = document.createElement("div"); vidPreview.style.cssText = "margin-top:6px;font-size:10.5px;color:var(--text-dim2);";
    function updateVidPreview() {
      if (!vidInput.value) { vidPreview.textContent = ""; return; }
      const id = getYouTubeId(vidInput.value);
      vidPreview.textContent = id ? "✓ link reconhecido" : "✕ não reconhecido como link do YouTube — cole a URL completa (youtube.com/watch?v=... ou youtu.be/...)";
      vidPreview.style.color = id ? "var(--gold)" : "var(--tag-tech)";
    }
    vidInput.oninput = () => { exItem.video = vidInput.value; saveData(DATA); updateVidPreview(); };
    updateVidPreview();

    const setsLbl = document.createElement("div"); setsLbl.className="field-label"; setsLbl.textContent="Séries (reps por série)";
    const setsRow = document.createElement("div"); setsRow.className="set-edit-row";
    function renderSets() {
      setsRow.innerHTML = "";
      exItem.sets.forEach((r, s) => {
        const wrap = document.createElement("div"); wrap.className="set-edit";
        const inp = document.createElement("input"); inp.value = r;
        inp.oninput = () => { exItem.sets[s] = inp.value; saveData(DATA); };
        const rm = document.createElement("button"); rm.className="rm-set"; rm.textContent="✕";
        rm.onclick = () => { if (exItem.sets.length > 1) { exItem.sets.splice(s,1); saveData(DATA); renderSets(); } };
        wrap.appendChild(inp); wrap.appendChild(rm);
        setsRow.appendChild(wrap);
      });
      const addBtn = document.createElement("button"); addBtn.className="add-set-btn"; addBtn.textContent="+";
      addBtn.onclick = () => { exItem.sets.push("8–12"); saveData(DATA); renderSets(); };
      setsRow.appendChild(addBtn);
    }
    renderSets();

    const intLbl = document.createElement("div"); intLbl.className="field-label"; intLbl.textContent="Intervalo";
    const intInput = document.createElement("input"); intInput.className="edit-input"; intInput.value=exItem.interval;
    intInput.oninput = () => { exItem.interval = intInput.value; saveData(DATA); };

    const techLbl = document.createElement("div"); techLbl.className="field-label"; techLbl.textContent="Técnica (opcional)";
    const techInput = document.createElement("input"); techInput.className="edit-input"; techInput.value=exItem.tech;
    techInput.oninput = () => { exItem.tech = techInput.value; saveData(DATA); };

    const execLbl = document.createElement("div"); execLbl.className="field-label"; execLbl.textContent="Execução / observação";
    const execInput = document.createElement("textarea"); execInput.className="edit-textarea"; execInput.value=exItem.exec;
    execInput.oninput = () => { exItem.exec = execInput.value; saveData(DATA); };

    const actions = document.createElement("div"); actions.className="ex-actions";
    const upBtn = document.createElement("button"); upBtn.textContent="▲ Subir";
    upBtn.onclick = () => { if (i>0) { const t=list[i-1]; list[i-1]=list[i]; list[i]=t; saveData(DATA); renderEditar(); } };
    const downBtn = document.createElement("button"); downBtn.textContent="▼ Descer";
    downBtn.onclick = () => { if (i<list.length-1) { const t=list[i+1]; list[i+1]=list[i]; list[i]=t; saveData(DATA); renderEditar(); } };
    const delBtn = document.createElement("button"); delBtn.className="danger"; delBtn.textContent="🗑 Excluir";
    delBtn.onclick = () => { list.splice(i,1); saveData(DATA); renderEditar(); };
    actions.appendChild(upBtn); actions.appendChild(downBtn); actions.appendChild(delBtn);

    card.appendChild(nameLbl); card.appendChild(nameSelect);
    card.appendChild(focusLbl); card.appendChild(focusInput);
    card.appendChild(catLbl); card.appendChild(catSelect);
    card.appendChild(gripLbl); card.appendChild(gripSelect);
    card.appendChild(imgLbl); card.appendChild(imgInput); card.appendChild(imgPreview);
    card.appendChild(vidLbl); card.appendChild(vidInput); card.appendChild(vidPreview);
    card.appendChild(setsLbl); card.appendChild(setsRow);
    card.appendChild(intLbl); card.appendChild(intInput);
    card.appendChild(techLbl); card.appendChild(techInput);
    card.appendChild(execLbl); card.appendChild(execInput);
    card.appendChild(actions);
    return card;
  }

  function renderEditar() {
    renderEditTabs();
    renderEditDayTitle();
    const d = DATA[current];
    exEditEl.innerHTML = "";
    d.exercises.forEach((exItem, i) => exEditEl.appendChild(renderEditCard(exItem, i, d.exercises)));
    const addExBtn = document.createElement("button");
    addExBtn.className = "add-ex-btn";
    addExBtn.textContent = "+ Adicionar exercício";
    addExBtn.onclick = () => {
      d.exercises.push(ex("Novo exercício","", ["8–12","8–12","8–12"], "60s", "", "", "—", "", "", "Outros"));
      saveData(DATA); renderEditar();
    };
    exEditEl.appendChild(addExBtn);
  }

  // ---- nav / screens ----
  function setActiveTab(tab) {
    activeTab = tab;
    tabTreino.style.display = tab === "treino" ? "block" : "none";
    tabBiblioteca.style.display = tab === "biblioteca" ? "block" : "none";
    tabEditar.style.display = tab === "editar" ? "block" : "none";
    treinoFooter.style.display = tab === "treino" ? "block" : "none";
    progressWrap.style.display = tab === "treino" ? "block" : "none";
    navTreino.classList.toggle("active", tab === "treino");
    navBiblioteca.classList.toggle("active", tab === "biblioteca");
    navEditar.classList.toggle("active", tab === "editar");
    if (tab === "treino") { screenTitle.textContent = "Ficha de Treino"; screenSub.textContent = "Hipertrofia · V-Shape"; renderTreino(); }
    if (tab === "biblioteca") { screenTitle.textContent = "Exercícios"; screenSub.textContent = CATALOG.length + " cadastrados"; renderBiblioteca(); }
    if (tab === "editar") { screenTitle.textContent = "Editar Ficha"; screenSub.textContent = "Monte sua ficha"; renderEditar(); }
  }
  navTreino.onclick = () => setActiveTab("treino");
  navBiblioteca.onclick = () => setActiveTab("biblioteca");
  navEditar.onclick = () => setActiveTab("editar");

  resetBtn.onclick = () => {
    Object.keys(PROGRESS).forEach(k => {
      if (k.indexOf("done:" + current + ":") === 0 || k.indexOf("kg:" + current + ":") === 0) delete PROGRESS[k];
    });
    saveProgress(); renderTreino();
  };

  exportBtn.onclick = () => {
    const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "ficha_treino.json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };
  importInput.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (ORDER.every(code => parsed[code] && Array.isArray(parsed[code].exercises))) {
          DATA = parsed; saveData(DATA); CATALOG = loadCatalog(); setActiveTab(activeTab);
        } else { alert("Arquivo inválido — não parece uma ficha exportada por este app."); }
      } catch (err) { alert("Não consegui ler esse arquivo JSON."); }
    };
    reader.readAsText(file);
    importInput.value = "";
  };
  restoreBtn.onclick = () => {
    if (confirm("Isso substitui a ficha atual pelo padrão original. Deseja continuar?")) {
      DATA = defaultData(); saveData(DATA);
      PROGRESS = {}; saveProgress();
      setActiveTab(activeTab);
    }
  };

  setActiveTab("treino");
})();
</script>
</body>
</html>
